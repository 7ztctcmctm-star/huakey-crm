name: Trivy Security Scan

on:
  push:
    branches: [ main ]
    paths:
      - "backend/Dockerfile"
      - "Dockerfile.synology"
      - "backend/package*.json"
      - "frontend/package*.json"
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: "backend/Dockerfile"
            context: "./backend"
          - dockerfile: "Dockerfile.synology"
            context: "."
    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag
        id: vars
        run: |
          TAG=$(echo "${{ matrix.dockerfile }}" | sed 's/\//-/g')
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: "crm-scan:${{ steps.vars.outputs.tag }}"

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "crm-scan:${{ steps.vars.outputs.tag }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      # Trivy 发现漏洞 exit 1 时 SARIF 已生成，此条件确保门禁失败时结果仍上传至 Security tab
      - name: Upload Trivy results to GitHub Security
        if: ${{ !cancelled() && steps.trivy.outcome != 'skipped' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  scan-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on repo filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          trivy-config: "trivy.yaml"
          skip-dirs: "node_modules,.git,dist,uploads,database/backups"

      - name: Upload filesystem scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-fs-results.sarif"
