name: CRM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发：发版前由发布经理按需运行跨浏览器矩阵
  workflow_dispatch:
  schedule:
    # 每周一 02:00 UTC（北京时间 10:00）
    # 背景：cross-browser-test 作业的条件是 schedule / workflow_dispatch，
    # 但原 on: 未声明这两个事件，导致该作业自创建以来从未被执行（死配置）。
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: setup-node
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-backend-deps-${{ hashFiles('backend/package-lock.json') }}
      - run: cd backend && npm ci
      - run: cd backend && npm run lint
      - name: Prepare upload directories
        # backend/uploads/** 在 .gitignore 中，checkout 后不存在。
        # routes/knowledge.js 依赖 ../uploads/knowledge 作为 multer 的磁盘目的地；
        # 生产镜像由 Dockerfile 的 `RUN mkdir -p /app/uploads` 保证，CI 需等价准备，
        # 否则 multer 写盘 ENOENT → 500（tests/knowledge.test.js「上传允许的文档类型」失败）。
        # 注意：该测试 mock 了 fs.existsSync → true，因此代码内 `if (!existsSync) mkdir` 的自建逻辑不会生效。
        run: mkdir -p backend/uploads/knowledge
      - run: cd backend && npm test
      - name: npm audit（容忍注册表瞬时错误，真实漏洞立即失败）
        # npm audit 是唯一查询实时 advisory DB 的门禁：runner 到 registry.npmjs.org 的
        # 瞬时故障（5xx/超时）会以 exit 1 结束，与「发现真实漏洞」无法用退出码区分。
        # 区分方式：真实漏洞输出漏洞表；瞬时错误输出 "audit endpoint returned an error"
        # 或网络层错误。仅后者重试（3 次），前者与未知错误立即失败。
        run: |
          cd backend
          for i in 1 2 3; do
            OUT=$(npm audit --audit-level=high --production 2>&1)
            RC=$?
            echo "$OUT"
            if [ $RC -eq 0 ]; then
              exit 0
            fi
            if echo "$OUT" | grep -qE "audit endpoint returned an error|npm error network|ETIMEDOUT|ECONNRESET|EAI_AGAIN|504 Gateway|502 Bad Gateway"; then
              echo "::warning::npm audit 注册表/网络瞬时错误（第 $i/3 次），10s 后重试"
              sleep 10
              continue
            fi
            echo "::error::npm audit 失败且非注册表/网络瞬时错误（疑似真实漏洞），不重试"
            exit 1
          done
            echo "::error::npm audit 连续 3 次因注册表/网络瞬时错误失败"
            exit 1
      # 安全回归套件（cors/headers/rateLimit/upload/两轮 securityFixes）：
      # jest.config.js 的 testPathIgnorePatterns 排除 tests/security/，npm test 不跑它们；
      # 由本 step 显式驱动（--testPathIgnorePatterns 覆盖排除，同 migration-test 对 roundtrip 的处理）。
      # 2026-10-22 D1 接入：此前只在本地跑，两处存量失败（mock req 缺 headers、
      # Compose v5 把 mem_limit 序列化为字符串）从未被 CI 暴露。
      - run: cd backend && npm run test:security

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: setup-node
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-frontend-deps-${{ hashFiles('frontend/package-lock.json') }}
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd frontend && npm run lint
      - run: cd frontend && npm test

  frontend-build:
    needs: frontend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: setup-node
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-frontend-deps-${{ hashFiles('frontend/package-lock.json') }}
      - run: cd frontend && npm ci --legacy-peer-deps && npm run build
      - run: test -f frontend/dist/index.html
      - run: |
          size=$(du -sm frontend/dist | cut -f1)
          if [ "$size" -gt 10 ]; then
            echo "::warning::Build output exceeds 10MB (${size}MB)"
          fi
      - run: bash scripts/check-bundle.sh

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose -f docker-compose.ci.yml up -d
      - run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL ready!"
              break
            fi
            echo "  attempt $i/30..."
            sleep 3
          done
          # 兜底：循环正常结束（未 break）说明 30 次未就绪，必须显式失败，
          # 否则后续步骤会在半就绪的库上跑出误导性报错（曾掩盖过真实启动失败）。
          if ! docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
            echo "::error::MySQL 未在 30 次尝试内就绪（ci-mysql mysqladmin ping 失败）"
            exit 1
          fi
      - run: cd backend && npm ci
      - run: cd database/migrations && npm ci
      - uses: ./.github/actions/setup-test-db
      - run: cd backend && npx jest tests/e2e/ --config jest.integration.config.js --forceExit
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  e2e-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose -f docker-compose.ci.yml up -d
      - run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL ready!"
              break
            fi
            echo "  attempt $i/30..."
            sleep 3
          done
          # 兜底：循环正常结束（未 break）说明 30 次未就绪，必须显式失败，
          # 否则后续步骤会在半就绪的库上跑出误导性报错（曾掩盖过真实启动失败）。
          if ! docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
            echo "::error::MySQL 未在 30 次尝试内就绪（ci-mysql mysqladmin ping 失败）"
            exit 1
          fi
      - run: cd backend && npm ci
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd database/migrations && npm ci
      - uses: ./.github/actions/setup-test-db
      - uses: ./.github/actions/seed-test-db
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        env:
          SKIP_DB_SETUP: 'true'
        # e2e-test 仅在 push main 时触发，作为核心业务流程的快速反馈闸门。
        # 只运行 chromium project（CI 已安装 chromium），避免 firefox/webkit/iPhone 12 Pro
        # 因浏览器未安装而失败。跨浏览器/移动设备的全面覆盖由 cross-browser-test job 负责
        # （定时/手动触发，matrix: chromium/firefox/webkit/iPhone 12 Pro）。
        # 核心业务测试（quotation/customer/approval/navigation）在移动项目上已 test.skip，
        # 仅 login/responsive 在移动设备上有意义，已在 cross-browser-test 中覆盖。
        run: cd frontend && npx playwright test --project=chromium
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  migration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose -f docker-compose.ci.yml up -d
      - run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL ready!"
              break
            fi
            echo "  attempt $i/30..."
            sleep 3
          done
          # 兜底：循环正常结束（未 break）说明 30 次未就绪，必须显式失败，
          # 否则后续步骤会在半就绪的库上跑出误导性报错（曾掩盖过真实启动失败）。
          if ! docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
            echo "::error::MySQL 未在 30 次尝试内就绪（ci-mysql mysqladmin ping 失败）"
            exit 1
          fi
      - run: cd backend && npm ci
      - run: cd database/migrations && npm ci
      - uses: ./.github/actions/setup-test-db
      # MIGRATION_ROUNDTRIP_STRICT=1：本 job 声明"DB 已就绪"，故测试里的任何静默跳过都必须变成失败
      # （不能用 CI=true 判定 —— Actions 在所有 job 都设它，backend-test 也会跑到该文件且无 MySQL）
      # --testPathIgnorePatterns 覆盖配置里对该文件的排除：roundtrip 是破坏性套件，
      # 只允许在本 job（严格模式 + 一次性全新库）里单独显式运行，绝不进共享池。
      - run: cd backend && MIGRATION_ROUNDTRIP_STRICT=1 DB_NAME=huakey_crm_test DB_PASSWORD=test_root_pass npx jest tests/db/migration-roundtrip.test.js --forceExit --testTimeout=240000 --testPathIgnorePatterns="/node_modules/"
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  cross-browser-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # browser = `playwright install` 的目标（只接受浏览器名）；
        # project = `playwright test --project` 的目标（playwright.config.js 里的项目名）。
        # ⚠️ 旧写法 matrix.browser 同时充当两者，'iPhone 12 Pro' 是**设备描述符**不是浏览器名，
        # 传给 `playwright install` 必败（1s 即败），导致该作业自创建以来从未真正执行过测试。
        # iPhone 12 Pro 设备底层走 webkit，故安装 webkit、以 device 项目运行。
        include:
          - { browser: 'chromium', project: 'chromium' }
          - { browser: 'firefox', project: 'firefox' }
          - { browser: 'webkit', project: 'webkit' }
          - { browser: 'webkit', project: 'iPhone 12 Pro' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose -f docker-compose.ci.yml up -d
      - run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL ready!"
              break
            fi
            echo "  attempt $i/30..."
            sleep 3
          done
          # 兜底：循环正常结束（未 break）说明 30 次未就绪，必须显式失败，
          # 否则后续步骤会在半就绪的库上跑出误导性报错（曾掩盖过真实启动失败）。
          if ! docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
            echo "::error::MySQL 未在 30 次尝试内就绪（ci-mysql mysqladmin ping 失败）"
            exit 1
          fi
      - run: cd backend && npm ci
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd database/migrations && npm ci
      - uses: ./.github/actions/setup-test-db
      - uses: ./.github/actions/seed-test-db
      - run: cd frontend && npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright tests
        env:
          SKIP_DB_SETUP: 'true'
        run: cd frontend && npx playwright test --project='${{ matrix.project }}'
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v