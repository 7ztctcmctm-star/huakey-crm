name: CRM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  security-events: write

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-deps-${{ hashFiles('backend/package-lock.json') }}
      - run: cd backend && npm ci
      - run: cd backend && npm run lint
      - run: cd backend && npm test
      - run: cd backend && npm audit --audit-level=high --production

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/package-lock.json') }}
      - run: cd frontend && npm install --legacy-peer-deps
      - run: cd frontend && npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/package-lock.json') }}
      - run: cd frontend && npm install --legacy-peer-deps && npm run build
      - run: test -f frontend/dist/index.html
      - run: |
          size=$(du -sm frontend/dist | cut -f1)
          if [ "$size" -gt 10 ]; then
            echo "::warning::Build output exceeds 10MB (${size}MB)"
          fi
      - run: bash scripts/check-bundle.sh

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose -f docker-compose.ci.yml up -d
      - run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL ready!"
              break
            fi
            echo "  attempt $i/30..."
            sleep 3
          done
      - run: cd backend && npm ci
      - run: cd database/migrations && npm ci
      - name: Import baseline schema + create missing tables
        run: |
          echo "Importing init-complete.sql..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" deploy/init-complete.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Applying post-dump schema changes (missing tables + DDL from migrations 056-092)..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" deploy/ci-missing-tables.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Creating CI test users (from .github/ci/test-users.sql)..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" .github/ci/test-users.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Recording all migration versions as executed..."
          for f in database/migrations/[0-9][0-9][0-9]_*.sql; do
            case "$f" in *_down.sql) continue ;; esac
            v=$(basename "$f" | grep -oP '^\d+')
            n=$(basename "$f")
            docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test \
              -e "INSERT IGNORE INTO schema_migrations (version, name) VALUES ('$v', '$n')"
          done
          echo "Baseline ready."
      - run: cd backend && npx jest tests/e2e/ --config jest.integration.config.js --forceExit
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  e2e-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose -f docker-compose.ci.yml up -d
      - run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL ready!"
              break
            fi
            echo "  attempt $i/30..."
            sleep 3
          done
      - run: cd backend && npm ci
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd database/migrations && npm ci
      - name: Import baseline schema + create missing tables
        run: |
          echo "Importing init-complete.sql..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" deploy/init-complete.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Applying post-dump schema changes (missing tables + DDL from migrations 056-092)..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" deploy/ci-missing-tables.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Creating CI test users (from .github/ci/test-users.sql)..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" .github/ci/test-users.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Recording all migration versions as executed..."
          for f in database/migrations/[0-9][0-9][0-9]_*.sql; do
            case "$f" in *_down.sql) continue ;; esac
            v=$(basename "$f" | grep -oP '^\d+')
            n=$(basename "$f")
            docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test \
              -e "INSERT IGNORE INTO schema_migrations (version, name) VALUES ('$v', '$n')"
          done
          echo "Baseline ready."
      - name: Load Demo seed data (demo_admin / demo_sales / demo_purchase)
        # E2E 通过 .env.test 的 E2E_ADMIN_USER=demo_admin 登录，需先 seed Demo 账号 + 业务链
        # seed-demo.js 自带生产环境阻断 + 幂等保护
        run: cd backend && DB_NAME=huakey_crm_test DB_USER=root DB_PASSWORD=test_root_pass DB_HOST=127.0.0.1 DB_PORT=3306 npm run seed:demo
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        env:
          SKIP_DB_SETUP: 'true'
        # e2e-test 仅在 push main 时触发，作为核心业务流程的快速反馈闸门。
        # 只运行 chromium project（CI 已安装 chromium），避免 firefox/webkit/iPhone 12 Pro
        # 因浏览器未安装而失败。跨浏览器/移动设备的全面覆盖由 cross-browser-test job 负责
        # （定时/手动触发，matrix: chromium/firefox/webkit/iPhone 12 Pro）。
        # 核心业务测试（quotation/customer/approval/navigation）在移动项目上已 test.skip，
        # 仅 login/responsive 在移动设备上有意义，已在 cross-browser-test 中覆盖。
        run: cd frontend && npx playwright test --project=chromium
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  migration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose -f docker-compose.ci.yml up -d
      - run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL ready!"
              break
            fi
            echo "  attempt $i/30..."
            sleep 3
          done
      - run: cd backend && npm ci
      - run: cd database/migrations && npm ci
      - name: Import baseline schema + create missing tables
        run: |
          echo "Importing init-complete.sql..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" deploy/init-complete.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Applying post-dump schema changes (missing tables + DDL from migrations 056-092)..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" deploy/ci-missing-tables.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Creating CI test users (from .github/ci/test-users.sql)..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" .github/ci/test-users.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Recording all migration versions as executed..."
          for f in database/migrations/[0-9][0-9][0-9]_*.sql; do
            case "$f" in *_down.sql) continue ;; esac
            v=$(basename "$f" | grep -oP '^\d+')
            n=$(basename "$f")
            docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test \
              -e "INSERT IGNORE INTO schema_migrations (version, name) VALUES ('$v', '$n')"
          done
          echo "Baseline ready."
      - run: cd backend && DB_NAME=huakey_crm_test DB_PASSWORD=test_root_pass npx jest tests/db/migration-roundtrip.test.js --forceExit --testTimeout=240000
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t huakey-crm:ci -f Dockerfile.synology .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'huakey-crm:ci'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL'
  cross-browser-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, 'iPhone 12 Pro']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose -f docker-compose.ci.yml up -d
      - run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL ready!"
              break
            fi
            echo "  attempt $i/30..."
            sleep 3
          done
      - run: cd backend && npm ci
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd database/migrations && npm ci
      - name: Import baseline schema + create missing tables
        run: |
          echo "Importing init-complete.sql..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" deploy/init-complete.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Applying post-dump schema changes (missing tables + DDL from migrations 056-092)..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" deploy/ci-missing-tables.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Creating CI test users (from .github/ci/test-users.sql)..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" .github/ci/test-users.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Recording all migration versions as executed..."
          for f in database/migrations/[0-9][0-9][0-9]_*.sql; do
            case "$f" in *_down.sql) continue ;; esac
            v=$(basename "$f" | grep -oP '^\d+')
            n=$(basename "$f")
            docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test \
              -e "INSERT IGNORE INTO schema_migrations (version, name) VALUES ('$v', '$n')"
          done
          echo "Baseline ready."
      - name: Load Demo seed data (demo_admin / demo_sales / demo_purchase)
        # E2E 通过 .env.test 的 E2E_ADMIN_USER=demo_admin 登录，需先 seed Demo 账号 + 业务链
        run: cd backend && DB_NAME=huakey_crm_test DB_USER=root DB_PASSWORD=test_root_pass DB_HOST=127.0.0.1 DB_PORT=3306 npm run seed:demo
      - run: cd frontend && npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright tests
        env:
          SKIP_DB_SETUP: 'true'
        run: cd frontend && npx playwright test --project='${{ matrix.browser }}'
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v