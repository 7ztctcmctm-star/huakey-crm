          docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test -e "CREATE TABLE IF NOT EXISTS crm_purchase_request (id INT PRIMARY KEY AUTO_INCREMENT, title VARCHAR(200) NOT NULL, request_no VARCHAR(50), dept_id INT, request_by INT, request_date DATE, expected_date DATE, urgency VARCHAR(20) DEFAULT 'normal', status VARCHAR(20) DEFAULT 'draft', total_amount DECIMAL(12,2) DEFAULT 0, remark TEXT, deleted_at DATETIME, create_time DATETIME DEFAULT CURRENT_TIMESTAMP, update_time DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP, INDEX idx_status (status), INDEX idx_request_by (request_by)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4"
          docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test -e "CREATE TABLE IF NOT EXISTS crm_purchase_comparison (id INT PRIMARY KEY AUTO_INCREMENT, title VARCHAR(200) NOT NULL, request_id INT, compare_no VARCHAR(50), status VARCHAR(20) DEFAULT 'draft', remark TEXT, deleted_at DATETIME, create_time DATETIME DEFAULT CURRENT_TIMESTAMP, update_time DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP, INDEX idx_status (status)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4"
          docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test -e "CREATE TABLE IF NOT EXISTS crm_purchase_comparison_item (id INT PRIMARY KEY AUTO_INCREMENT, comparison_id INT NOT NULL, supplier_id INT, product_name VARCHAR(200), spec VARCHAR(200), quantity DECIMAL(12,2), unit VARCHAR(20), unit_price DECIMAL(12,2), total_price DECIMAL(12,2), delivery_days INT, remark TEXT, deleted_at DATETIME, create_time DATETIME DEFAULT CURRENT_TIMESTAMP, INDEX idx_comparison (comparison_id)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4"
          docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test -e "CREATE TABLE IF NOT EXISTS crm_user_permission (id INT PRIMARY KEY AUTO_INCREMENT, user_id INT NOT NULL, permission_id INT NOT NULL, create_time DATETIME DEFAULT CURRENT_TIMESTAMP, UNIQUE KEY uk_user_permission (user_id, permission_id), INDEX idx_user_id (user_id), INDEX idx_permission_id (permission_id)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci"
          docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test -e "CREATE TABLE IF NOT EXISTS sys_customer_status (id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY, code VARCHAR(32) NOT NULL, name VARCHAR(50) NOT NULL, sort_order INT DEFAULT 0, is_default TINYINT(1) DEFAULT 0, is_end TINYINT(1) DEFAULT 0, color VARCHAR(20) DEFAULT '', created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP, UNIQUE KEY uk_code (code)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci"
          docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test -e "CREATE TABLE IF NOT EXISTS sys_customer_status_transition (id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY, from_code VARCHAR(32) NOT NULL, to_code VARCHAR(32) NOT NULL, require_permission VARCHAR(50) DEFAULT NULL, require_reason TINYINT(1) DEFAULT 0, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, UNIQUE KEY uk_transition (from_code, to_code), KEY idx_from_code (from_code)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci"
          docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test -e "CREATE TABLE IF NOT EXISTS crm_scoring_rule (id INT PRIMARY KEY AUTO_INCREMENT, name VARCHAR(100) NOT NULL, module VARCHAR(50) NOT NULL, field_name VARCHAR(50), operator VARCHAR(20), threshold VARCHAR(100), score INT DEFAULT 0, is_active TINYINT(1) DEFAULT 1, create_time DATETIME DEFAULT CURRENT_TIMESTAMP, update_time DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4"
          echo "Recording all migration versions as executed (init-complete.sql baseline)..."
          for f in database/migrations/[0-9][0-9][0-9]_*.sql; do
            case "$f" in *_down.sql) continue ;; esac
            v=$(basename "$f" | grep -oP '^\d+')
            n=$(basename "$f")
            docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test \
              -e "INSERT IGNORE INTO schema_migrations (version, name) VALUES ('$v', '$n')"
          done
          echo "Baseline ready."
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        env:
          SKIP_DB_SETUP: 'true'
        run: cd frontend && npx playwright test
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  migration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose -f docker-compose.ci.yml up -d
