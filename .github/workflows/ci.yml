name: CRM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  security-events: write

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-deps-${{ hashFiles('backend/package-lock.json') }}
      - run: cd backend && npm ci
      - run: cd backend && npm run lint
      - run: cd backend && npm test
      - run: cd backend && npm audit --audit-level=high --production

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/package-lock.json') }}
      - run: cd frontend && npm install --legacy-peer-deps
      - run: cd frontend && npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/package-lock.json') }}
      - run: cd frontend && npm install --legacy-peer-deps && npm run build
      - run: test -f frontend/dist/index.html
      - run: |
          size=$(du -sm frontend/dist | cut -f1)
          if [ "$size" -gt 10 ]; then
            echo "::warning::Build output exceeds 10MB (${size}MB)"
          fi
      - run: bash scripts/check-bundle.sh

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose -f docker-compose.ci.yml up -d
      - run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL ready!"
              break
            fi
            echo "  attempt $i/30..."
            sleep 3
          done
      - run: cd backend && npm ci
      - run: cd database/migrations && npm ci
      - name: Import baseline schema + mark migrations done
        run: |
          echo "Importing init-complete.sql..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" deploy/init-complete.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Recording all migration versions as executed..."
          for f in database/migrations/[0-9][0-9][0-9]_*.sql; do
            v=$(basename "$f" | grep -oP '^\d+')
            n=$(basename "$f")
            docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test \
              -e "INSERT IGNORE INTO schema_migrations (version, name) VALUES ('$v', '$n')"
          done
          echo "Baseline ready."
      - run: cd backend && npx jest tests/e2e/ --forceExit --testTimeout=30000 --testPathPatterns='e2e'
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  e2e-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose -f docker-compose.ci.yml up -d
      - run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL ready!"
              break
            fi
            echo "  attempt $i/30..."
            sleep 3
          done
      - run: cd backend && npm ci
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd database/migrations && npm ci
      - name: Import baseline schema + mark migrations done
        run: |
          echo "Importing init-complete.sql..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" deploy/init-complete.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Recording all migration versions as executed..."
          for f in database/migrations/[0-9][0-9][0-9]_*.sql; do
            v=$(basename "$f" | grep -oP '^\d+')
            n=$(basename "$f")
            docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test \
              -e "INSERT IGNORE INTO schema_migrations (version, name) VALUES ('$v', '$n')"
          done
          echo "Baseline ready."
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        env:
          SKIP_DB_SETUP: 'true'
        run: cd frontend && npx playwright test
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  migration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose -f docker-compose.ci.yml up -d
      - run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL ready!"
              break
            fi
            echo "  attempt $i/30..."
            sleep 3
          done
      - run: cd backend && npm ci
      - run: cd database/migrations && npm ci
      - name: Import baseline schema + mark migrations done
        run: |
          echo "Importing init-complete.sql..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" deploy/init-complete.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Recording all migration versions as executed..."
          for f in database/migrations/[0-9][0-9][0-9]_*.sql; do
            v=$(basename "$f" | grep -oP '^\d+')
            n=$(basename "$f")
            docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test \
              -e "INSERT IGNORE INTO schema_migrations (version, name) VALUES ('$v', '$n')"
          done
          echo "Baseline ready."
      - run: cd backend && DB_NAME=huakey_crm_test DB_PASSWORD=test_root_pass npx jest tests/db/migration-roundtrip.test.js --forceExit --testTimeout=120000
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t huakey-crm:ci -f deploy/synology/Dockerfile.synology .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'huakey-crm:ci'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL'
  cross-browser-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, 'iPhone 12 Pro']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose -f docker-compose.ci.yml up -d
      - run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL ready!"
              break
            fi
            echo "  attempt $i/30..."
            sleep 3
          done
      - run: cd backend && npm ci
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd database/migrations && npm ci
      - name: Import baseline schema + mark migrations done
        run: |
          echo "Importing init-complete.sql..."
          sed "s/\`huakey_crm\`/\`huakey_crm_test\`/g; s/'huakey_crm'/'huakey_crm_test'/g" deploy/init-complete.sql | \
          docker exec -i ci-mysql mysql -u root -ptest_root_pass huakey_crm_test
          echo "Recording all migration versions as executed..."
          for f in database/migrations/[0-9][0-9][0-9]_*.sql; do
            v=$(basename "$f" | grep -oP '^\d+')
            n=$(basename "$f")
            docker exec ci-mysql mysql -u root -ptest_root_pass huakey_crm_test \
              -e "INSERT IGNORE INTO schema_migrations (version, name) VALUES ('$v', '$n')"
          done
          echo "Baseline ready."
      - run: cd frontend && npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright tests
        env:
          SKIP_DB_SETUP: 'true'
        run: cd frontend && npx playwright test --project='${{ matrix.browser }}'
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v