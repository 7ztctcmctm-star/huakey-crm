# ============================================
# 铧旗CRM — Production 环境
# Container Manager 项目导入此文件
# ============================================

services:

  mysql:
    # [P2-12] digest 固定于 2026-10-26；升级流程见 docs/image-digests.md
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: crm-prod-mysql
    restart: unless-stopped
    mem_limit: 512m
    cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # fail-fast：缺少任一凭据时 compose 直接报错，避免容器以空密码启动
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?生产环境必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: huakey_crm
      MYSQL_USER: crm_user
      # 与 synology/base 栈统一：应用账号口令统一取 DB_PASSWORD
      MYSQL_PASSWORD: ${DB_PASSWORD:?生产环境必须设置 DB_PASSWORD}
      TZ: Asia/Shanghai
    # MySQL 端口仅容器内网访问，不暴露到宿主机
    # 如需本地直连调试，取消下行注释:
    # ports:
    #   - "3307:3306"
    volumes:
      - prod-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb_buffer_pool_size=128M
      - --innodb_log_file_size=64M
      - --max_connections=100
      - --skip-host-cache
      - --skip-name-resolve
      - --explicit_defaults_for_timestamp=1
    healthcheck:
      # [P2-16] 口令经 MYSQL_PWD 传入，不出现在 healthcheck 命令行（docker inspect / ps 可见）
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    # [P2-12] digest 固定于 2026-10-26；升级流程见 docs/image-digests.md
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    container_name: crm-prod-redis
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Asia/Shanghai
    command:
      - redis-server
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    build:
      context: /volume1/docker/huakey-crm-deploy
      dockerfile: Dockerfile.synology
    container_name: crm-prod-app
    restart: unless-stopped
    mem_limit: 512m
    cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: crm_user
      DB_PASSWORD: ${DB_PASSWORD:?生产环境必须设置 DB_PASSWORD}
      DB_NAME: huakey_crm
      # 生产 NODE_ENV=production 时 app.js 对空 CORS 直接 exit(1)
      CORS_ORIGIN: ${CORS_ORIGIN:?生产环境必须设置 CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET:?生产环境必须设置 JWT_SECRET（128 位 hex）}
      JWT_EXPIRES_IN: 7d
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-}
      MIMO_MODEL: ${MIMO_MODEL:-}
      NODE_OPTIONS: --max-old-space-size=512
      TZ: Asia/Shanghai
    ports:
      - "6789:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - /volume1/docker/huakey-crm-deploy/prod/backend:/app
      - /volume1/docker/huakey-crm-deploy/prod/frontend/dist:/app/frontend/dist
      - /volume1/docker/huakey-crm-deploy/prod/database/migrations:/app/database/migrations:ro
      - prod-app-uploads:/app/uploads
      # [P2-10 2026-10-26] /app 被 bind mount 覆盖，镜像内的 logs 目录与属主不生效；
      # 具名卷初始化时继承镜像中 /app/logs 的 nodejs 属主，避免日志写入 EACCES。
      - prod-app-logs:/app/logs

volumes:
  prod-mysql-data:
  prod-app-uploads:
  prod-app-logs:
