# 铧旗CRM NAS 反向代理配置
# 由 docker-compose.synology.yml 挂载到 /etc/nginx/conf.d/default.conf
#
# 生产环境 HTTPS 配置说明：
# 1. 将 SSL 证书（fullchain.pem / privkey.pem 或 .crt / .key）放到 NAS 的 ./deploy/ssl/ 目录
# 2. 必须将下方 server_name 的占位符 your-domain.com 替换为真实生产域名
# 3. docker-compose.synology.yml 已将 ./deploy/ssl 挂载到 /etc/nginx/ssl

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=60m max_size=100m;

# HTTP：强制跳转到 HTTPS
server {
    listen 80;
    server_name your-domain.com;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 与后端 multer 10MB 保持一致，避免 Nginx 提示和 multer 拒绝不一致
    client_max_body_size 10M;

    # 所有 HTTP 请求 301 重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：生产环境主服务
server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL 证书（生产环境请替换为真实路径和文件名）
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL 安全参数
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：强制浏览器后续使用 HTTPS（生产环境建议开启）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # 与后端 multer 10MB 保持一致
    client_max_body_size 10M;

    location /api/v1/ {
        proxy_pass http://app:5000;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://app:5000;
        proxy_cache STATIC;
        proxy_cache_valid 200 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://app:5000;
        proxy_cache STATIC;
        proxy_cache_valid 200 30m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml application/json;
        gzip_min_length 1024;
    }

    # 带 hash 的静态资源 — 长期缓存（Vite content hash 保证唯一性）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://app:5000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
