# 铧旗CRM NAS 反向代理配置
# 由 docker-compose.synology.yml 挂载到 /etc/nginx/conf.d/default.conf

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=60m max_size=100m;

server {
    listen 80;
    server_name localhost;

    # 与后端 multer 10MB 保持一致，避免 Nginx 提示和 multer 拒绝不一致
    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://app:5000;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://app:5000;
        proxy_cache STATIC;
        proxy_cache_valid 200 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://app:5000;
        proxy_cache STATIC;
        proxy_cache_valid 200 30m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml application/json;
        gzip_min_length 1024;
    }

    # 带 hash 的静态资源 — 长期缓存（Vite content hash 保证唯一性）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://app:5000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
