# ============================================
# 铧旗CRM — Test 环境
# Container Manager 项目导入此文件
# ============================================

services:

  redis:
    image: redis:7-alpine
    container_name: crm-test-redis
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "6380:6379"
    volumes:
      - test-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: crm-test-mysql
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: huakey_crm_test
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - test-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: /volume1/docker/huakey-crm-deploy
      dockerfile: Dockerfile.synology
    container_name: crm-test-app
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: crm_user
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: huakey_crm_test
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      AI_PROVIDER: ${AI_PROVIDER:-}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-}
      MIMO_MODEL: ${MIMO_MODEL:-}
      NODE_OPTIONS: --max-old-space-size=512
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "true"
      # REDIS_PASSWORD: ${REDIS_PASSWORD:-}  # 生产环境启用Redis密码
    ports:
      - "6790:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /volume1/docker/huakey-crm-deploy/test/backend:/app
      - /volume1/docker/huakey-crm-deploy/test/frontend/dist:/app/frontend/dist
      - /volume1/docker/huakey-crm-deploy/test/database/migrations:/app/database/migrations:ro
      - test-app-uploads:/app/uploads

volumes:
  test-mysql-data:
  test-app-uploads:
  test-redis-data:
