# ============================================
# 铧旗CRM — 群晖NAS 稳定版部署配置
# 使用路径：/volume1/docker/crm-stack
# 使用方法：docker compose -f docker-compose.synology.yml up -d --build
# ============================================

services:

  # ---- 数据库 ----
  mysql:
    image: mysql:8.0
    container_name: huakey-mysql
    restart: unless-stopped
    init: true
    mem_limit: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-huakey_crm}
      MYSQL_USER: ${DB_USER:-crm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/init-complete.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./database/backups:/backups
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb_buffer_pool_size=256M
      - --innodb_log_file_size=128M
      - --max_connections=100
      - --skip-host-cache
      - --skip-name-resolve
      - --explicit_defaults_for_timestamp=1
      - --slow_query_log=ON
      - --long_query_time=2
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -u root -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - crm-network

  # ---- 缓存 ----
  redis:
    image: redis:7-alpine
    container_name: huakey-redis
    restart: unless-stopped
    init: true
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-}
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - crm-network

  # ---- 应用（前端 + 后端一体化） ----
  app:
    build:
      context: .
      dockerfile: Dockerfile.synology
    # 镜像 tag: 默认 latest, 发布时可用 APP_IMAGE=crm-stack-app:v1.x.x 指定版本
    image: ${APP_IMAGE:-crm-stack-app:latest}
    container_name: huakey-app
    restart: unless-stopped
    init: true
    mem_limit: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-crm_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-huakey_crm}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AUTO_RELEASE_DAYS: ${AUTO_RELEASE_DAYS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SKIP_CAPTCHA: ${SKIP_CAPTCHA:-false}
      # Swagger 文档（生产环境必须为 false）
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      # AI 模型（Ollama 本地，可选）
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      # 邮箱加密密钥（可选，用于集成邮箱凭证加密）
      EMAIL_ENC_KEY: ${EMAIL_ENC_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
      ALERT_ENABLED: ${ALERT_ENABLED:-false}
      WECHAT_WEBHOOK_URL: ${WECHAT_WEBHOOK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "6789:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-uploads:/app/uploads
      - ./database/migrations:/app/database/migrations:ro
      - app-logs:/app/logs          # named volume 自动继承镜像内目录属主，避免 bind mount 权限陷阱
      - ./database/backups:/app/data/backups  # 数据库备份持久化
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - crm-network

  # ---- 数据库自动备份（每日凌晨 2:00，Phase 10 P1-2）----
  # mysql:8.0 镜像内置 busybox crond，无需额外安装
  # 备份脚本通过 volume 挂载注入，与 app 容器共享 ./database/backups 目录
  backup:
    image: mysql:8.0
    container_name: huakey-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "0 2 * * * /backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        crond -f -l 2
    volumes:
      - ./database/backup.sh:/backup.sh:ro
      - ./database/backups:/backups
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DATABASE: ${DB_NAME:-huakey_crm}
    mem_limit: 64m
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - crm-network

volumes:
  mysql-data:
    driver: local
  app-uploads:
    driver: local
  app-logs:
    driver: local

networks:
  crm-network:
    name: crm-network
    driver: bridge
