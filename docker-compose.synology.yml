# ============================================
# 铧旗CRM — 群晖NAS 专用部署配置
# 使用方法：在群晖 Container Manager 的"项目"中导入此文件
# ============================================

services:

  # ---- 数据库 ----
  mysql:
    image: mysql:8.0
    container_name: huakey-mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: huakey_crm
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    #ports:
    #  - "3307:3306"   # 生产环境不暴露；如需调试取消注释
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/init-complete.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./database/backups:/backups
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb_buffer_pool_size=128M
      - --max_connections=50
      - --slow_query_log=ON
      - --long_query_time=2
      - --innodb_log_file_size=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - crm-network

  # ---- 缓存 ----
  redis:
    image: redis:7-alpine
    container_name: huakey-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - redis-server
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - crm-network

  # ---- 应用（前端 + 后端一体化） ----
  app:
    build:
      context: .
      dockerfile: Dockerfile.synology
    container_name: huakey-app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: crm_user
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: huakey_crm
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "6789:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-uploads:/app/uploads
      - ./database/migrations:/app/database/migrations:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - crm-network

  # ---- Nginx 反向代理 ----
  nginx:
    image: nginx:alpine
    container_name: crm-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx-synology.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - crm-network

  # ---- 数据库自动备份（每日凌晨 2:00）----
  backup:
    image: mysql:8.0
    container_name: huakey-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "0 2 * * * /backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        crond -f -l 2
    volumes:
      - ./database/backup.sh:/backup.sh:ro
      - ./database/backups:/backups
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - crm-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  mysql-data:
    driver: local
  app-uploads:
    driver: local

networks:
  crm-network:
    driver: bridge
