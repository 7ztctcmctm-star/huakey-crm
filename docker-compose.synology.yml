# ============================================
# 铧旗CRM — 群晖NAS 专用部署配置
# 使用方法：在群晖 Container Manager 的"项目"中导入此文件
# ============================================

services:

  # ---- 数据库 ----
  mysql:
    image: mysql:8.0
    container_name: huakey-mysql
    restart: unless-stopped
    mem_limit: 512m
    cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: huakey_crm
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-complete.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- 应用（前端 + 后端一体化） ----
  app:
    build:
      context: .
      dockerfile: Dockerfile.synology
    container_name: huakey-app
    restart: unless-stopped
    mem_limit: 512m
    cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: crm_user
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: huakey_crm
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
    ports:
      - "6789:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app-uploads:/app/uploads
      - ./database/migrations:/app/database/migrations:ro

volumes:
  mysql-data:
    driver: local
  app-uploads:
    driver: local
