# ============================================
# 铧旗CRM — 群晖NAS 稳定版部署配置
# 使用路径：/volume1/docker/crm-stack
# 使用方法：docker compose -f docker-compose.synology.yml up -d --build
# ============================================

services:

  # ---- 数据库 ----
  mysql:
    image: mysql:8.0
    container_name: huakey-mysql
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-huakey_crm}
      MYSQL_USER: ${DB_USER:-crm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # 生产环境不暴露 MySQL 端口；如需外部调试，取消下行注释
    # ports:
    #   - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/init-complete.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./database/backups:/backups
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb_buffer_pool_size=256M
      - --innodb_log_file_size=128M
      - --max_connections=100
      - --skip-host-cache
      - --skip-name-resolve
      - --explicit_defaults_for_timestamp=1
      - --slow_query_log=ON
      - --long_query_time=2
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -u root -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - crm-network

  # ---- 缓存 ----
  redis:
    image: redis:7-alpine
    container_name: huakey-redis
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - redis-server
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - crm-network

  # ---- 应用（前端 + 后端一体化） ----
  app:
    build:
      context: .
      dockerfile: Dockerfile.synology
    container_name: huakey-app
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-crm_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-huakey_crm}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AUTO_RELEASE_DAYS: ${AUTO_RELEASE_DAYS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SKIP_CAPTCHA: ${SKIP_CAPTCHA:-false}
    ports:
      - "6789:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-uploads:/app/uploads
      - ./database/migrations:/app/database/migrations:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - crm-network

  # ---- Nginx 反向代理 ----
  nginx:
    image: nginx:alpine
    container_name: huakey-nginx
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx-synology.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - crm-network

  # 注意：数据库自动备份建议通过 DSM 任务计划器或宿主机 cron 执行，
  # 参考 database/backup.sh。容器内不常驻 cron，避免基础镜像差异导致失败。

volumes:
  mysql-data:
    driver: local
  app-uploads:
    driver: local

networks:
  crm-network:
    name: crm-network
    driver: bridge
