# ============================================
# 铧旗CRM — 群晖NAS 稳定版部署配置
# 使用路径：/volume1/docker/crm-stack
# 使用方法：docker compose -f docker-compose.synology.yml up -d --build
#
# ⚠️ 资源限制说明：
#   AGENTS.md 第七章 26 节要求容器必须设置 mem_limit / cpus 资源限制，
#   但 Synology DSM 内核不支持 cgroup v1 CPU CFS scheduler，
#   因此本 compose 全部去掉 cpus / mem_limit，否则 docker compose up -d 报错：
#   "NanoCPUs can not be set, as your kernel does not support CPU CFS scheduler"
#   其他环境（Linux 服务器 / 本地 Docker Desktop）请使用
#   docker-compose.prod.yml / docker-compose.yml（均带资源限制）。
# ============================================

services:

  # ---- 数据库 ----
  mysql:
    # [P2-12] digest 固定于 2026-10-26；升级流程见 docs/image-digests.md
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: huakey-mysql
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # fail-fast：缺少凭据时 compose 直接报错，避免 MySQL 以空密码初始化
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?生产环境必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-huakey_crm}
      MYSQL_USER: ${DB_USER:-crm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?生产环境必须设置 DB_PASSWORD}
      # [步骤 B3 · 时区统一] 容器时区（配合下方 --default-time-zone 双保险）
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/init-complete.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      # [D3] buffer pool 自适应入口（原写死 256M，改由启动脚本按宿主机内存 25% 探测，
      #       钳制 [128M,1024M]；env INNODB_BUFFER_POOL_SIZE_MB 可手动覆盖）
      - ./deploy/mysql-entrypoint.sh:/usr/local/bin/mysql-entrypoint.sh:ro
      - ./database/backups:/backups
    # [D3] 原 command: 参数段（character-set/collation/pool/log/connections/时区等）
    #       已逐条迁入 deploy/mysql-entrypoint.sh，仅 innodb_buffer_pool_size 改自适应。
    #       官方 docker-entrypoint.sh 的首启初始化逻辑不受影响。
    entrypoint: ["/usr/local/bin/mysql-entrypoint.sh"]
    healthcheck:
      # [P2-16] 口令走 MYSQL_PWD，不出现在 healthcheck 命令行
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h localhost -u root -e 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - crm-network

  # ---- 缓存 ----
  redis:
    # [P2-12] digest 固定于 2026-10-26；升级流程见 docs/image-digests.md
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    container_name: huakey-redis
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # [P0-11] 健康检查需要同一口令；容器内通过 REDISCLI_AUTH 读取，避免把明文写进 healthcheck
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-}
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    healthcheck:
      # [P0-11] 原为裸 `redis-cli ping`：设置了 requirepass 时返回 NOAUTH，容器永远 unhealthy，
      # 依赖 service_healthy 的 app 无法启动。有口令走 REDISCLI_AUTH，无口令保持裸 ping。
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - crm-network

  # ---- 应用（前端 + 后端一体化） ----
  app:
    build:
      context: .
      dockerfile: Dockerfile.synology
    container_name: huakey-app
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-crm_user}
      DB_PASSWORD: ${DB_PASSWORD:?生产环境必须设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-huakey_crm}
      JWT_SECRET: ${JWT_SECRET:?生产环境必须设置 JWT_SECRET（128 位 hex）}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AUTO_RELEASE_DAYS: ${AUTO_RELEASE_DAYS:-30}
      # 生产 NODE_ENV=production 时 app.js 对空 CORS 直接 exit(1)，改为 compose 层 fail-fast
      CORS_ORIGIN: ${CORS_ORIGIN:?生产环境必须设置 CORS_ORIGIN}
      SKIP_CAPTCHA: ${SKIP_CAPTCHA:-false}
      # Swagger 文档（生产环境必须为 false）
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      # AI 模型（Ollama 本地，可选）
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      # 邮箱加密密钥（可选，用于集成邮箱凭证加密）
      EMAIL_ENC_KEY: ${EMAIL_ENC_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
      # [P2-11] 默认开启告警；显式 false 仍可关闭，但启动会打印警告
      ALERT_ENABLED: ${ALERT_ENABLED:-true}
      WECHAT_WEBHOOK_URL: ${WECHAT_WEBHOOK_URL:-}
      # [P2-09] 访问日志走 logger.http()，默认 info 会把它过滤掉
      LOG_LEVEL: ${LOG_LEVEL:-http}
    expose:
      - "5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-uploads:/app/uploads
      - ./database/migrations:/app/database/migrations:ro
      - app-logs:/app/logs          # named volume 自动继承镜像内目录属主，避免 bind mount 权限陷阱
      - ./database/backups:/app/data/backups  # 数据库备份持久化
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - crm-network

  # ---- 自动备份（容器内调度：02:00 MySQL / 02:30 uploads / 02:45 配置+证书）----
  # mysql:8.0 镜像无 crond（原 crond -f 方案导致容器无限崩溃，2026-08-31 审计修复），
  # 改用 deploy/backup/container-backup.sh 内置定点等待循环，零外部依赖。
  # 宿主机 /etc/cron.d/crm-backup 每日 04:00 另有一份 MySQL 备份兜底（双保险）。
  # 手动验证：docker exec huakey-backup sh /container-backup.sh --once
  backup:
    # [P2-12] digest 固定于 2026-10-26；升级流程见 docs/image-digests.md
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: huakey-backup
    restart: unless-stopped
    # [D3] 日志轮转：与 mysql/redis/app 对齐（10m×3），防止容器日志无限增长吃满系统盘
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["/bin/sh", "/container-backup.sh"]
    volumes:
      - ./deploy/backup/container-backup.sh:/container-backup.sh:ro
      - ./database/backup.sh:/backup.sh:ro
      # [D3] 月度恢复演练脚本（容器内调度器每月 1 日 03:00 触发，双模式：
      #       有 docker CLI 走 exec，否则经 mysql -h mysql 直连）
      - ./deploy/backup/restore-test.sh:/restore-test.sh:ro
      - ./database/backups:/backups
      # uploads 文件备份源（app-uploads named volume 只读）
      - app-uploads:/uploads:ro
      # 配置备份源（宿主机关键文件只读挂载，最小暴露面）
      - ./.env:/stack/.env:ro
      - ./.env.secrets:/stack/.env.secrets:ro
      - ./docker-compose.synology.yml:/stack/docker-compose.synology.yml:ro
      - ./nginx:/stack/nginx:ro
      # [D3] 备份加密口令文件（openssl rand 生成，仅存在于 NAS 宿主机、不入仓库；
      #       缺失时 config 备份自动排除 .env.secrets 防明文落盘，见 container-backup.sh）
      - ./.backup-enc-pass:/stack/.backup-enc-pass:ro
      # 时区与宿主机保持一致，保证 02:00/02:30/02:45 为本地时间
      - /etc/localtime:/etc/localtime:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DATABASE: ${DB_NAME:-huakey_crm}
      TZ: ${TZ:-Asia/Shanghai}
      # [P1-12] 生产 fail-closed：口令文件缺失时拒绝生成明文 DB/uploads 备份
      BACKUP_REQUIRE_ENCRYPTION: "true"
      # [P2-15] 与宿主机 mysql-backup.sh 共用同一保留期，避免 7 天/30 天两套口径
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - crm-network

  # ---- HTTPS 反向代理（容器层，8443 端口）----
  # 生产架构：DSM nginx (80/443) → huakey-nginx (8443) → app (5000)
  # DSM nginx 做 SSL 终端 (crm.huakey.local)，容器 nginx 在 8443 做二级反代
  # 主机 80/443 由 DSM 自带 nginx 占用，禁止在此声明 80:80 / 443:443
  nginx:
    # [P2-12] digest 固定于 2026-10-26；升级流程见 docs/image-digests.md
    image: nginx:alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    container_name: huakey-nginx
    restart: unless-stopped
    # [D3] 日志轮转：与 mysql/redis/app 对齐（10m×3）
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://localhost:8443/api/v1/health", "--no-check-certificate"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - crm-network

volumes:
  mysql-data:
    driver: local
  app-uploads:
    driver: local
  app-logs:
    driver: local

networks:
  crm-network:
    name: crm-network
    driver: bridge
