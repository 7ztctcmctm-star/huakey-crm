# ============================================
# 铧旗CRM — 群晖NAS 稳定版部署配置
# 使用路径：/volume1/docker/crm-stack
# 使用方法：docker compose -f docker-compose.synology.yml up -d --build
# ============================================

services:

  # ---- 数据库 ----
  mysql:
    image: mysql:8.0
    container_name: huakey-mysql
    restart: unless-stopped
    init: true
    mem_limit: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-huakey_crm}
      MYSQL_USER: ${DB_USER:-crm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/init-complete.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./database/backups:/backups
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb_buffer_pool_size=256M
      - --innodb_log_file_size=128M
      - --max_connections=100
      - --skip-host-cache
      - --skip-name-resolve
      - --explicit_defaults_for_timestamp=1
      - --slow_query_log=ON
      - --long_query_time=2
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -u root -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - crm-network

  # ---- 缓存 ----
  redis:
    image: redis:7-alpine
    container_name: huakey-redis
    restart: unless-stopped
    init: true
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-}
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - crm-network

  # ---- 应用（前端 + 后端一体化） ----
  app:
    build:
      context: .
      dockerfile: Dockerfile.synology
    container_name: huakey-app
    restart: unless-stopped
    init: true
    mem_limit: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-crm_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-huakey_crm}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AUTO_RELEASE_DAYS: ${AUTO_RELEASE_DAYS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SKIP_CAPTCHA: ${SKIP_CAPTCHA:-false}
      # Swagger 文档（生产环境必须为 false）
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      # AI 模型（Ollama 本地，可选）
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      # 邮箱加密密钥（可选，用于集成邮箱凭证加密）
      EMAIL_ENC_KEY: ${EMAIL_ENC_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
      ALERT_ENABLED: ${ALERT_ENABLED:-false}
      WECHAT_WEBHOOK_URL: ${WECHAT_WEBHOOK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-uploads:/app/uploads
      - ./database/migrations:/app/database/migrations:ro
      - app-logs:/app/logs          # named volume 自动继承镜像内目录属主，避免 bind mount 权限陷阱
      - ./database/backups:/app/data/backups  # 数据库备份持久化
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - crm-network

  # ---- 自动备份（容器内调度：02:00 MySQL / 02:30 uploads / 02:45 配置+证书）----
  # mysql:8.0 镜像无 crond（原 crond -f 方案导致容器无限崩溃，2026-08-31 审计修复），
  # 改用 deploy/backup/container-backup.sh 内置定点等待循环，零外部依赖。
  # 宿主机 /etc/cron.d/crm-backup 每日 04:00 另有一份 MySQL 备份兜底（双保险）。
  # 手动验证：docker exec huakey-backup sh /container-backup.sh --once
  backup:
    image: mysql:8.0
    container_name: huakey-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/container-backup.sh"]
    volumes:
      - ./deploy/backup/container-backup.sh:/container-backup.sh:ro
      - ./database/backup.sh:/backup.sh:ro
      - ./database/backups:/backups
      # uploads 文件备份源（app-uploads named volume 只读）
      - app-uploads:/uploads:ro
      # 配置备份源（宿主机关键文件只读挂载，最小暴露面）
      - ./.env:/stack/.env:ro
      - ./.env.secrets:/stack/.env.secrets:ro
      - ./docker-compose.synology.yml:/stack/docker-compose.synology.yml:ro
      - ./nginx:/stack/nginx:ro
      # 时区与宿主机保持一致，保证 02:00/02:30/02:45 为本地时间
      - /etc/localtime:/etc/localtime:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DATABASE: ${DB_NAME:-huakey_crm}
      TZ: ${TZ:-Asia/Shanghai}
    mem_limit: 128m
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - crm-network

  # ---- HTTPS 反向代理（容器层，8443 端口）----
  # 生产架构：DSM nginx (80/443) → huakey-nginx (8443) → app (5000)
  # DSM nginx 做 SSL 终端 (crm.huakey.local)，容器 nginx 在 8443 做二级反代
  # 主机 80/443 由 DSM 自带 nginx 占用，禁止在此声明 80:80 / 443:443
  nginx:
    image: nginx:alpine
    container_name: huakey-nginx
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://localhost:8443/api/v1/health", "--no-check-certificate"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - crm-network

volumes:
  mysql-data:
    driver: local
  app-uploads:
    driver: local
  app-logs:
    driver: local

networks:
  crm-network:
    name: crm-network
    driver: bridge
