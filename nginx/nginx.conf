# 铧旗CRM 容器层 nginx 配置（NAS 生产实际运行版本）
# 由 docker-compose.synology.yml 挂载到 /etc/nginx/conf.d/default.conf
#
# 生产架构（双层 nginx）：
#   客户端 → DSM nginx (80/443, SSL 终端, crm.huakey.local)
#            → proxy_pass https://127.0.0.1:8443
#            → huakey-nginx 容器 (8443, 二级反代)
#            → app:5000
#
# 注意：主机 80/443 由 DSM 自带 nginx 占用，本容器仅监听 8443。
# SSL 证书 server.crt/server.key 放在 ./nginx/certs/ 目录（不入仓库）。

server {
    listen 8443 ssl;
    http2 on;
    server_name 192.168.0.200 _;

    # SSL 证书
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全头（TLS 在容器层终止，可启用 HSTS）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # 请求大小限制
    client_max_body_size 50m;

    # 反向代理到 App
    location / {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        # helmet 会对上游响应附加 X-Frame-Options: SAMEORIGIN，与本层 DENY 重复且排在前面
        # （浏览器取第一个，DENY 会被削弱），隐藏上游值，仅保留本层 DENY
        proxy_hide_header X-Frame-Options;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
