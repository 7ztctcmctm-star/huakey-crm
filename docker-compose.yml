# ============================================
# 铧旗CRM系统 — Docker Compose 部署配置
# 使用方法: docker-compose up -d
# ============================================

services:
  mysql:
    image: mysql:8.0
    container_name: huakey-mysql
    restart: unless-stopped
    mem_limit: 512M
    cpus: 1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-huakey_crm}
      MYSQL_USER: ${DB_USER:-crm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # 生产环境不暴露 MySQL 端口，仅内网访问
    # 如需本地直连，取消下行注释:
    # ports:
    #   - "${DB_PORT:-3306}:3306"
    volumes:
      - ./docker/data/mysql:/var/lib/mysql
      - ./init-complete.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: huakey-redis
    restart: unless-stopped
    mem_limit: 256M
    cpus: 0.5
    # [M-006] 生产环境不暴露 Redis 端口，仅内网访问（backend 通过服务名连接）
    # 如需本地调试，取消下行注释:
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: huakey-backend
    restart: unless-stopped
    # [M-007] 资源限制：与 mysql/redis/frontend 一致，防止 OOM 吃光宿主机内存
    mem_limit: 512M
    cpus: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-crm_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-huakey_crm}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "false"
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # [M-007] 健康检查：容器假死时编排层可感知并重启
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: sh -c "node database/migrations/run_migrations.js && node app.js"
    volumes:
      - ./database/migrations:/app/database/migrations:ro
      # [M-007] 上传文件持久化：容器重启后文件不丢失
      - ./docker/data/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: huakey-frontend
    restart: unless-stopped
    mem_limit: 256M
    cpus: 0.5
    ports:
      - "80:80"
    depends_on:
      - backend
